<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SPORTS EDGE PRO</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #07111f;
      color: #ffffff;
    }

    header {
      background: #102640;
      border-bottom: 1px solid #29496a;
      padding: 22px 5%;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
    }

    header h1 span {
      color: #ffbd17;
    }

    .container {
      width: 90%;
      max-width: 1150px;
      margin: 35px auto;
    }

    /* LOGIN */

    #loginSection {
      max-width: 430px;
      margin: 70px auto;
      background: #102640;
      border: 1px solid #315579;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.35);
    }

    #loginSection h2 {
      margin-top: 0;
      text-align: center;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #b8c7d9;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border-radius: 9px;
      border: 1px solid #496986;
      background: #081827;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #ffbd17;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 13px 20px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary-btn {
      width: 100%;
      background: #ffbd17;
      color: #111;
      margin-bottom: 10px;
    }

    .secondary-btn {
      width: 100%;
      background: #29496a;
      color: white;
      margin-bottom: 10px;
    }

    .forgot-btn {
      width: 100%;
      background: transparent;
      color: #ffbd17;
      padding: 8px;
    }

    button:hover {
      opacity: 0.9;
    }

    #loginMessage {
      text-align: center;
      margin-top: 15px;
      color: #ff8d8d;
      min-height: 20px;
    }

    /* DASHBOARD */

    #dashboard {
      display: none;
    }

    .dashboard-top {
      background: #102640;
      border: 1px solid #315579;
      border-radius: 16px;
      padding: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .dashboard-top h2 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .logged-user {
      color: #b8c7d9;
      margin: 0;
    }

    .dashboard-buttons {
      display: flex;
      gap: 10px;
    }

    .refresh-btn {
      background: #ffbd17;
      color: #111;
    }

    .logout-btn {
      background: #29496a;
      color: white;
    }

    .section-title {
      font-size: 27px;
      margin-bottom: 8px;
    }

    #matchStatus {
      color: #aebfd2;
      margin-bottom: 22px;
    }

    /* MATCH GRID */

    #matchesBox {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .match-card {
      background: #102640;
      border: 1px solid #315579;
      border-radius: 14px;
      padding: 20px;
      min-height: 220px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .match-card:hover {
      transform: translateY(-3px);
      border-color: #ffbd17;
    }

    .match-card h3 {
      color: #ffbd17;
      margin: 0 0 18px;
      font-size: 19px;
      line-height: 1.2;
    }

    .match-card p {
      color: #d2dce8;
      margin: 10px 0;
      line-height: 1.4;
      font-size: 14px;
    }

    .score-box {
      background: #081827;
      border-radius: 8px;
      padding: 10px;
      margin-top: 12px;
      color: white;
    }

    .score-label {
      color: #ffbd17;
      font-weight: 700;
    }

    .error-box {
      grid-column: 1 / -1;
      background: #32191d;
      border: 1px solid #74343c;
      border-radius: 12px;
      padding: 20px;
      color: #ffb7b7;
    }

    /* MOBILE */

    @media (max-width: 1000px) {
      #matchesBox {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 650px) {

      header {
        padding: 18px 20px;
      }

      header h1 {
        font-size: 23px;
      }

      .container {
        width: 94%;
        margin: 20px auto;
      }

      #loginSection {
        margin: 35px auto;
        padding: 25px;
      }

      .dashboard-top {
        flex-direction: column;
        align-items: flex-start;
      }

      .dashboard-buttons {
        width: 100%;
      }

      .dashboard-buttons button {
        flex: 1;
      }

      #matchesBox {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header>
    <h1>
      SPORTS <span>EDGE PRO</span>
    </h1>
  </header>


  <!-- LOGIN -->

  <main class="container">

    <section id="loginSection">

      <h2>Welcome Back</h2>

      <p class="subtitle">
        Sign in to access Sports Edge Pro
      </p>

      <input
        id="email"
        type="email"
        placeholder="Email address"
        autocomplete="email"
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button
        id="loginBtn"
        class="primary-btn"
      >
        Login
      </button>

      <button
        id="createBtn"
        class="secondary-btn"
      >
        Create Account
      </button>

      <button
        id="forgotBtn"
        class="forgot-btn"
      >
        Forgot Password?
      </button>

      <div id="loginMessage"></div>

    </section>


    <!-- DASHBOARD -->

    <section id="dashboard">

      <div class="dashboard-top">

        <div>
          <h2>Sports Dashboard</h2>

          <p class="logged-user">
            Logged in as:
            <span id="userEmail"></span>
          </p>
        </div>

        <div class="dashboard-buttons">

          <button
            id="refreshBtn"
            class="refresh-btn"
          >
            Refresh
          </button>

          <button
            id="logoutBtn"
            class="logout-btn"
          >
            Logout
          </button>

        </div>

      </div>


      <h2 class="section-title">
        Live & Upcoming Matches
      </h2>

      <div id="matchStatus">
        Loading matches...
      </div>

      <div id="matchesBox"></div>

    </section>

  </main>


  <!-- FIREBASE -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      sendPasswordResetEmail,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    /* ==========================
       FIREBASE CONFIG
       ========================== */

    const firebaseConfig = {

      apiKey:
        "AIzaSyDoudYXuwRqGxpOUl7BfQmmrloYoyKiPK0",

      authDomain:
        "ports-edge-pro.firebaseapp.com",

      projectId:
        "ports-edge-pro",

      storageBucket:
        "ports-edge-pro.firebasestorage.app",

      messagingSenderId:
        "811569206008",

      appId:
        "1:811569206008:web:bd2acd5ec511f0c9d4e10d",

      measurementId:
        "G-2S8PCFC271"
    };


    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);


    /* ==========================
       API
       ========================== */

    const MATCH_API =
      "https://sports-edge-api.sk-suneeth.workers.dev/matches";


    /* ==========================
       ELEMENTS
       ========================== */

    const loginSection =
      document.getElementById("loginSection");

    const dashboard =
      document.getElementById("dashboard");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginBtn =
      document.getElementById("loginBtn");

    const createBtn =
      document.getElementById("createBtn");

    const forgotBtn =
      document.getElementById("forgotBtn");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const refreshBtn =
      document.getElementById("refreshBtn");

    const loginMessage =
      document.getElementById("loginMessage");

    const userEmail =
      document.getElementById("userEmail");

    const matchesBox =
      document.getElementById("matchesBox");

    const matchStatus =
      document.getElementById("matchStatus");


    /* ==========================
       MESSAGE
       ========================== */

    function showMessage(message) {

      loginMessage.textContent =
        message;
    }


    /* ==========================
       LOGIN
       ========================== */

    loginBtn.addEventListener(
      "click",
      async () => {

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (!email || !password) {

          showMessage(
            "Please enter email and password."
          );

          return;
        }


        try {

          showMessage("Logging in...");

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

          showMessage("");

        } catch (error) {

          console.error(error);

          showMessage(
            error.message
              .replace("Firebase: Error (auth/", "")
              .replace(").", "")
          );
        }

      }
    );


    /* ==========================
       CREATE ACCOUNT
       ========================== */

    createBtn.addEventListener(
      "click",
      async () => {

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (!email || !password) {

          showMessage(
            "Enter email and password first."
          );

          return;
        }


        if (password.length < 6) {

          showMessage(
            "Password must be at least 6 characters."
          );

          return;
        }


        try {

          showMessage(
            "Creating account..."
          );

          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );

          showMessage(
            "Account created successfully."
          );

        } catch (error) {

          console.error(error);

          showMessage(
            error.message
              .replace("Firebase: Error (auth/", "")
              .replace(").", "")
          );
        }

      }
    );


    /* ==========================
       FORGOT PASSWORD
       ========================== */

    forgotBtn.addEventListener(
      "click",
      async () => {

        const email =
          emailInput.value.trim();


        if (!email) {

          showMessage(
            "Enter your email address first."
          );

          return;
        }


        try {

          await sendPasswordResetEmail(
            auth,
            email
          );

          showMessage(
            "Password reset email sent."
          );

        } catch (error) {

          console.error(error);

          showMessage(
            error.message
              .replace("Firebase: Error (auth/", "")
              .replace(").", "")
          );
        }

      }
    );


    /* ==========================
       LOGOUT
       ========================== */

    logoutBtn.addEventListener(
      "click",
      async () => {

        try {

          await signOut(auth);

        } catch (error) {

          console.error(error);

        }

      }
    );


    /* ==========================
       REFRESH
       ========================== */

    refreshBtn.addEventListener(
      "click",
      () => {

        loadMatches();

      }
    );


    /* ==========================
       AUTH STATE
       ========================== */

    onAuthStateChanged(
      auth,
      (user) => {

        if (user) {

          loginSection.style.display =
            "none";

          dashboard.style.display =
            "block";

          userEmail.textContent =
            user.email || "";

          loadMatches();

        } else {

          loginSection.style.display =
            "block";

          dashboard.style.display =
            "none";

          userEmail.textContent =
            "";

        }

      }
    );


    /* ==================================================
       CONVERT API DATA INTO READABLE TEXT
       ================================================== */

    function readable(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }


      if (
        typeof value === "string" ||
        typeof value === "number" ||
        typeof value === "boolean"
      ) {
        return String(value);
      }


      /* ARRAY */

      if (Array.isArray(value)) {

        return value
          .map(readable)
          .filter(Boolean)
          .join(" • ");
      }


      /* OBJECT */

      if (typeof value === "object") {


        /* TEAM NAME */

        if (
          value.teamName !== undefined
        ) {

          let result =
            readable(value.teamName);


          if (
            value.runs !== undefined
          ) {

            result +=
              " " +
              readable(value.runs);
          }


          if (
            value.wickets !== undefined
          ) {

            result +=
              "/" +
              readable(value.wickets);
          }


          if (
            value.overs !== undefined
          ) {

            result +=
              " (" +
              readable(value.overs) +
              ")";
          }


          return result;
        }


        /* TEAM */

        if (
          value.team !== undefined &&
          typeof value.team !== "object"
        ) {

          return readable(value.team);
        }


        /* NAME */

        if (
          value.name !== undefined &&
          typeof value.name !== "object"
        ) {

          return readable(value.name);
        }


        /* SHORT NAME */

        if (
          value.shortName !== undefined &&
          typeof value.shortName !== "object"
        ) {

          return readable(value.shortName);
        }


        /* TITLE */

        if (
          value.title !== undefined &&
          typeof value.title !== "object"
        ) {

          return readable(value.title);
        }


        /* SCORE */

        if (
          value.runs !== undefined ||
          value.wickets !== undefined ||
          value.overs !== undefined
        ) {

          let score = "";


          if (
            value.runs !== undefined
          ) {

            score +=
              readable(value.runs);
          }


          if (
            value.wickets !== undefined
          ) {

            score +=
              "/" +
              readable(value.wickets);
          }


          if (
            value.overs !== undefined
          ) {

            score +=
              " (" +
              readable(value.overs) +
              ")";
          }


          return score;
        }


        /* GENERIC OBJECT */

        return Object.entries(value)
          .map(
            ([key, val]) => {

              const result =
                readable(val);

              if (!result) {
                return "";
              }

              return result;
            }
          )
          .filter(Boolean)
          .join(" • ");
      }


      return "";
    }


    /* ==========================
       MATCH TITLE
       ========================== */

    function getMatchTitle(match) {

      let title =
        match.name ||
        match.title ||
        match.matchName;


      if (title) {

        return readable(title);
      }


      if (
        match.team1 &&
        match.team2
      ) {

        return (
          readable(match.team1) +
          " vs " +
          readable(match.team2)
        );
      }


      if (
        match.homeTeam &&
        match.awayTeam
      ) {

        return (
          readable(match.homeTeam) +
          " vs " +
          readable(match.awayTeam)
        );
      }


      return "Cricket Match";
    }


    /* ==========================
       SCORE
       ========================== */

    function getScore(match) {

      const score =
        match.score ||
        match.scorecard ||
        match.scores ||
        match.innings ||
        match.inning;


      if (!score) {
        return "";
      }


      return readable(score);
    }


    /* ==========================
       SHOW MATCHES
       ========================== */

    function showMatches(data) {

      matchesBox.innerHTML = "";


      let list;


      if (Array.isArray(data)) {

        list = data;

      } else {

        list =
          data.matches ||
          data.data ||
          data.events ||
          data.results ||
          [];
      }


      if (
        !Array.isArray(list) ||
        list.length === 0
      ) {

        matchStatus.textContent =
          "No matches found.";

        return;
      }


      matchStatus.textContent =
        list.length +
        " match(es)";


      list.forEach(
        (match) => {

          const card =
            document.createElement(
              "article"
            );

          card.className =
            "match-card";


          /* TITLE */

          const title =
            document.createElement(
              "h3"
            );

          title.textContent =
            getMatchTitle(match);


          card.appendChild(title);


          /* STATUS */

          const status =
            match.status ||
            match.matchStatus ||
            match.state ||
            match.result;


          if (status) {

            const p =
              document.createElement(
                "p"
              );

            p.textContent =
              readable(status);

            card.appendChild(p);
          }


          /* SERIES */

          const series =
            match.seriesName ||
            match.series ||
            match.tournament ||
            match.competition;


          if (series) {

            const p =
              document.createElement(
                "p"
              );

            p.textContent =
              "Series: " +
              readable(series);

            card.appendChild(p);
          }


          /* VENUE */

          const venue =
            match.venue ||
            match.ground ||
            match.location;


          if (venue) {

            const p =
              document.createElement(
                "p"
              );

            p.textContent =
              "Venue: " +
              readable(venue);

            card.appendChild(p);
          }


          /* SCORE */

          const score =
            getScore(match);


          if (score) {

            const scoreBox =
              document.createElement(
                "div"
              );

            scoreBox.className =
              "score-box";


            const label =
              document.createElement(
                "span"
              );

            label.className =
              "score-label";

            label.textContent =
              "Score: ";


            const value =
              document.createElement(
                "span"
              );

            value.textContent =
              score;


            scoreBox.appendChild(label);

            scoreBox.appendChild(value);

            card.appendChild(scoreBox);
          }


          /* DATE / TIME */

          const dateTime =
            match.dateTime ||
            match.startTime ||
            match.start ||
            match.date;


          if (dateTime) {

            const p =
              document.createElement(
                "p"
              );

            p.textContent =
              "Time: " +
              readable(dateTime);

            card.appendChild(p);
          }


          matchesBox.appendChild(card);

        }
      );

    }


    /* ==========================
       LOAD MATCHES
       ========================== */

    async function loadMatches() {

      matchStatus.textContent =
        "Loading matches...";

      matchesBox.innerHTML = "";


      try {

        const response =
          await fetch(MATCH_API);


        if (!response.ok) {

          throw new Error(
            "API returned " +
            response.status
          );
        }


        const data =
          await response.json();


        console.log(
          "SPORTS EDGE API DATA:",
          data
        );


        showMatches(data);


      } catch (error) {

        console.error(
          "Match API error:",
          error
        );


        matchStatus.textContent =
          "Unable to load matches.";


        matchesBox.innerHTML = `

          <div class="error-box">

            <strong>
              Match data could not be loaded.
            </strong>

            <br><br>

            Please try the Refresh button.

          </div>

        `;

      }

    }

  </script>

</body>
</html>
